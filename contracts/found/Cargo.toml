[package]
name = "dorks-found"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.7.0"
near-contract-standards = "=5.7.0"
near-sys = "=0.2.2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
