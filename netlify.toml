[build]
  command = "npm run build -- --outDir dist-launch && node scripts/netlify-routes.mjs"
  publish = "dist-launch"

[build.environment]
  NODE_VERSION = "22.22.2"

[[redirects]]
  from = "/play"
  to = "/play.html"
  status = 200

[[redirects]]
  from = "/mint"
  to = "/mint.html"
  status = 200
